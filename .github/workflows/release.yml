name: Release

on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:
    inputs:
      release-version:
        description: Stable version to release, set by the release train
        required: false
        type: string
      release-commit:
        description: Commit SHA to release, set by the release train
        required: false
        type: string
      dependency-ranges:
        description: JSON object of stable ranges that replace preview pins, set by the release train
        required: false
        default: "{}"
        type: string
      preview:
        description: Publish a preview under the npm dist-tag next from the default branch or a work/* branch
        required: false
        default: false
        type: boolean
      package-directory:
        description: Directory of the package to release, set by the release train
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release-packages-dms-saas:
    if: github.event_name != 'workflow_dispatch' || inputs.package-directory == 'packages/dms-saas'
    uses: AntelopeJS/.github/.github/workflows/release-npm-public.yml@v2
    with:
      release-version: ${{ inputs.release-version }}
      release-commit: ${{ inputs.release-commit }}
      dependency-ranges: ${{ inputs.dependency-ranges }}
      preview: ${{ inputs.preview == true }}
      package-directory: packages/dms-saas
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

  release-packages-interface-dms-saas:
    if: github.event_name != 'workflow_dispatch' || inputs.package-directory == 'packages/interface-dms-saas'
    uses: AntelopeJS/.github/.github/workflows/release-npm-public.yml@v2
    with:
      release-version: ${{ inputs.release-version }}
      release-commit: ${{ inputs.release-commit }}
      dependency-ranges: ${{ inputs.dependency-ranges }}
      preview: ${{ inputs.preview == true }}
      package-directory: packages/interface-dms-saas
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
