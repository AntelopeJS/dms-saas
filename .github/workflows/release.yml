name: Release DMS SaaS module

on:
  workflow_dispatch:
    inputs:
      channel:
        description: npm distribution channel
        required: true
        default: latest
        type: choice
        options: [latest, next]

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    name: Validate module release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release source and package metadata
        env:
          CHANNEL: ${{ inputs.channel }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$CHANNEL" in
            latest) test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ;;
            next) test "$GITHUB_REF" = "refs/heads/next" ;;
            *) exit 1 ;;
          esac
          node <<'NODE'
          const pkg = require('./packages/dms-saas/package.json')
          const iface = require('./packages/interface-dms-saas/package.json')
          // The interface sitting in the tree only has to SATISFY the range the
          // module publishes: a floor that lags it widens what consumers may
          // install, it does not create a second copy. The module implements
          // the interface, so it caps it below the next minor
          // (`>=<floor> <0.<minor+1>.0`): a breaking interface minor must never
          // reach a dms-saas that does not implement it.
          const compare = (a, b) => {
            const parts = (v) => v.split('-')[0].split('.').map(Number)
            const [x, y] = [parts(a), parts(b)]
            return x[0] - y[0] || x[1] - y[1] || x[2] - y[2]
          }
          const satisfiesImplementedRange = (version, range) => {
            const match = /^>=(0\.(\d+)\.\d+) <(0\.(\d+)\.0)$/.exec(range ?? '')
            if (!match || Number(match[4]) !== Number(match[2]) + 1) return false
            return compare(version, match[1]) >= 0 && compare(version, match[3]) < 0
          }
          if (pkg.name !== '@antelopejs/dms-saas' || pkg.repository.url !== 'git+https://github.com/AntelopeJS/dms-saas.git' || pkg.publishConfig.registry !== 'https://registry.npmjs.org/' || pkg.publishConfig.access !== 'public' || pkg.publishConfig.provenance !== true || !satisfiesImplementedRange(iface.version, pkg.dependencies['@antelopejs/interface-dms-saas'])) process.exit(1)
          NODE
      # The module resolves its interface through a `>=<floor> <0.<minor+1>.0`
      # range: releasing it before that interface version exists on npm would
      # ship a dependency nobody can install.
      - name: Verify the published interface
        run: node packages/dms-saas/scripts/verify-interface-package.cjs
  release:
    needs: validate
    uses: AntelopeJS/.github/.github/workflows/release-npm-public.yml@v1
    with:
      channel: ${{ inputs.channel }}
      package-directory: packages/dms-saas
    secrets:
      RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
