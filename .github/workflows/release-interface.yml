name: Release DMS SaaS interface

on:
  workflow_dispatch:
    inputs:
      channel:
        description: npm distribution channel
        required: true
        default: latest
        type: choice
        options: [latest, next]

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    name: Validate interface release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release source and package metadata
        env:
          CHANNEL: ${{ inputs.channel }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$CHANNEL" in
            latest) test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ;;
            next) test "$GITHUB_REF" = "refs/heads/next" ;;
            *) exit 1 ;;
          esac
          node <<'NODE'
          const pkg = require('./packages/interface-dms-saas/package.json')
          if (pkg.name !== '@antelopejs/interface-dms-saas' || pkg.repository.url !== 'git+https://github.com/AntelopeJS/dms-saas.git' || pkg.publishConfig.registry !== 'https://registry.npmjs.org/' || pkg.publishConfig.access !== 'public' || pkg.publishConfig.provenance !== true) process.exit(1)
          NODE
  release:
    needs: validate
    uses: AntelopeJS/.github/.github/workflows/release-npm-public.yml@v1
    with:
      channel: ${{ inputs.channel }}
      package-directory: packages/interface-dms-saas
    secrets:
      RELEASE_GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
