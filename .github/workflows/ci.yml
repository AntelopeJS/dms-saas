name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Three independent jobs instead of one sequence: the wall-clock is the
# slowest of them, not their sum.
jobs:
  # `pnpm run checks` builds both packages once (its `typecheck` step); lint
  # and `check:exports` (its `test` step) then read that build. The docs
  # tsconfig maps the interface onto its sources, so the docs check, which
  # runs before the build, needs no `dist`.
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v2
    with:
      docs-files: |
        README.md
        docs
        packages/dms-saas/README.md
        packages/dms-saas/docs
        packages/interface-dms-saas/README.md
        packages/interface-dms-saas/docs
      docs-typescript-project: packages/interface-dms-saas/docs/tsconfig.json
      renovate-sync: false
      test-job: false
    permissions:
      contents: read
    secrets:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

  # `ci-node.yml` exposes no outputs, so this takes the tier from the shared
  # rule of `ci-tier`: the jobs below run in every tier but a draft and the
  # `next` to `main` pull request, on Windows only in `nightly`. `e2e` picks
  # the Playwright journeys: the `@smoke` ones on a pull request,
  # every one in the merge queue, on a manual run or under the `ci:full`
  # label, and every one in `shards` runners nightly.
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      tests: ${{ steps.tier.outputs.tests }}
      os: ${{ steps.tier.outputs.os }}
      e2e: ${{ steps.tier.outputs.e2e }}
      shards: ${{ steps.tier.outputs.shards }}
      shard-total: ${{ steps.tier.outputs.shard-total }}
    steps:
      - name: Pick the tier with the shared rule
        id: pick
        uses: AntelopeJS/.github/.github/actions/ci-tier@v2
      - name: Pick the tier from the event, the target branch and the draft flag
        id: tier
        env:
          TIER: ${{ steps.pick.outputs.tier }}
          EVENT: ${{ github.event_name }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          tier="$TIER"

          tests=true
          if [[ "$tier" == none || "$tier" == draft ]]; then
            tests=false
          fi

          os='["ubuntu-latest"]'
          if [[ "$tier" == nightly ]]; then
            os='["ubuntu-latest","windows-latest"]'
          fi

          e2e=none
          shards='[1]'
          shard_total=1
          if [[ "$tests" == true ]]; then
            case "$EVENT" in
              merge_group | workflow_dispatch) e2e=all ;;
              schedule) e2e=all shards='[1, 2]' shard_total=2 ;;
              pull_request) if [[ "$FULL_LABEL" == true ]]; then e2e=all; else e2e=smoke; fi ;;
              *) e2e=smoke ;;
            esac
          fi

          {
            echo "tier=${tier}"
            echo "tests=${tests}"
            echo "os=${os}"
            echo "e2e=${e2e}"
            echo "shards=${shards}"
            echo "shard-total=${shard_total}"
          } >> "$GITHUB_OUTPUT"
          echo "Tier \`${tier}\`: tests ${tests}, runners ${os}, e2e ${e2e} on shards ${shards}" >> "$GITHUB_STEP_SUMMARY"

  # The Vitest suite is not part of `checks`: in its own job it runs alongside
  # the build and lint instead of after them, and keeps the mongod cache that
  # the reusable workflow has no input for.
  # The longest job: two runners, each running half of the test files.
  unit:
    needs: select
    if: needs.select.outputs.tests == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.select.outputs.os) }}
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # The Mongo-backed tests pin mongod 8.0.8, a 208 MB download every run
      # without this. mongodb-memory-server stores it in this home directory
      # by default.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-8.0.8-${{ runner.os }}

      # vitest aliases both packages to their sources: no build needed.
      - run: pnpm --filter @antelopejs/dms-saas test:unit --shard=${{ matrix.shard }}/2

  frontend:
    needs: select
    if: needs.select.outputs.tests == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.select.outputs.os) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Compile the published DMS source together with this frontend module.
      - run: pnpm --filter @antelopejs/dms-saas test:frontend

  # The playground has its own lockfile and tsconfig, so neither `checks` nor
  # the module build typechecks it. It links the interface through its `dist`.
  playground:
    needs: select
    if: needs.select.outputs.tests == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.select.outputs.os) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @antelopejs/interface-dms-saas build
      - run: pnpm install --dir packages/dms-saas/playground --ignore-workspace --frozen-lockfile
      - run: pnpm --dir packages/dms-saas/playground exec tsc --noEmit -p .

  # Vitest strips the suite's types without checking them, and the module
  # build covers `src` only. The suite resolves the interface through its
  # `dist`. `test/tsconfig.json` leaves out, by name, the tests that reach a
  # frontend composable reading the DMS auto-imports, which only exist in the
  # workspace `test:frontend` builds.
  test-types:
    needs: select
    if: needs.select.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @antelopejs/interface-dms-saas build
      - run: pnpm --dir packages/dms-saas exec tsc --noEmit -p test

  # TLC through the runner of @antelopejs/tooling-configs. The CI configuration
  # of each check: `node .agents/skills/<check>/check.mjs`.
  formal:
    needs: select
    if: needs.select.outputs.tests == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.select.outputs.os) }}
        check: [formal-guarded-plan-change, formal-workspace-creation-gate]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/antelopejs-formal
          key: tla2tools-1.7.4
      - run: node .agents/skills/${{ matrix.check }}/check.mjs

  # The browser journeys of e2e/ as a Playwright suite, as `select` picks
  # them: the merge queue runs them on one runner and the nightly run on two
  # shards. `e2e:build` builds what the run serves, and each runner's global
  # setup starts one run of the kit on it.
  e2e:
    needs: select
    if: needs.select.outputs.e2e != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.shards) }}
    env:
      E2E: ${{ needs.select.outputs.e2e }}
      SHARDS: ${{ needs.select.outputs.shard-total }}
      DMS_E2E_PREBUILT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: echo "DMS_E2E_RUNS=${RUNNER_TEMP}/dms-runs" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/mongodb-binaries
            ~/.cache/ms-playwright
            e2e/playground/.antelope/cache
          key: e2e-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'e2e/playground/antelope.config.ts') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/dms-e2e/frontend
          key: e2e-frontend-v2-${{ github.sha }}
          restore-keys: e2e-frontend-v2-
      - name: Install Chromium and its system packages
        run: |
          if timeout 240 pnpm exec playwright install --with-deps --only-shell chromium; then
            exit 0
          fi
          echo "::warning::Chromium's system packages did not install: installing the browser alone"
          pnpm exec playwright install --only-shell chromium
      - run: pnpm e2e:build
      - if: env.E2E == 'smoke'
        run: pnpm e2e --grep @smoke
      - if: env.E2E == 'all'
        run: pnpm e2e --shard=${{ matrix.shard }}/${{ env.SHARDS }} --reporter=blob,list,github
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: e2e/blob-report
      - if: always() && env.E2E == 'all'
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: e2e/blob-report
          retention-days: 3
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            e2e/test-results
            ${{ runner.temp }}/dms-runs/*/evidence
            ${{ runner.temp }}/dms-runs/*/logs
          retention-days: 7

  # The HTTP and command-line journeys, as the Vitest integration tests of
  # `test:journeys`, all of them wherever `e2e` runs. Its global setup starts
  # one run of the kit on what `e2e:build` built.
  journeys:
    needs: select
    if: needs.select.outputs.e2e != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DMS_E2E_PREBUILT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: echo "DMS_E2E_RUNS=${RUNNER_TEMP}/dms-runs" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/mongodb-binaries
            e2e/playground/.antelope/cache
          key: journeys-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'e2e/playground/antelope.config.ts') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/dms-e2e/frontend
          key: e2e-frontend-v2-${{ github.sha }}
          restore-keys: e2e-frontend-v2-
      - run: pnpm e2e:build
      - run: pnpm --filter @antelopejs/dms-saas test:journeys
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journeys-evidence
          path: |
            ${{ runner.temp }}/dms-runs/*/evidence
            ${{ runner.temp }}/dms-runs/*/logs
          retention-days: 7

  # One HTML and JSON report of every journey's run.
  e2e-report:
    needs: [select, e2e]
    if: always() && needs.select.outputs.e2e == 'all' && needs.e2e.result != 'cancelled' && needs.e2e.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: e2e/blob-reports
          merge-multiple: true
      - run: pnpm exec playwright merge-reports --reporter html,json e2e/blob-reports
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: e2e/playwright-report
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JSON_OUTPUT_FILE: e2e/playwright-report/results.json
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

  # The single check to require on `main`: it keeps the historical job name,
  # and fails when a job above failed or was cancelled, or on a draft, or when
  # `select` picks journeys and `e2e` or `journeys` was skipped. Another job the tier skipped
  # passes it.
  ubuntu:
    if: always()
    needs:
      [
        select,
        ci,
        unit,
        frontend,
        playground,
        test-types,
        formal,
        e2e,
        journeys,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: >-
          needs.select.result != 'success' || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.ci.result == 'skipped' || (needs.select.outputs.e2e != 'none' && needs.e2e.result == 'skipped') || (needs.select.outputs.e2e != 'none' && needs.journeys.result == 'skipped')
        run: exit 1
      - if: needs.select.outputs.tier == 'draft'
        run: |
          echo "::error::Draft pull request: only lint and typecheck ran. Mark it ready for review to run the tests."
          exit 1
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
      statuses: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v2
