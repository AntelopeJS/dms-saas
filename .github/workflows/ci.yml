name: ci

on:
  push:
    branches:
      - main
  # No branch filter: the lint wave stacks pull requests on top of each other,
  # and filtering on `main` left every intermediate step ungated -- only the
  # secret scanner ran there.
  pull_request:

  workflow_dispatch: null
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Three independent jobs instead of one sequence: the wall-clock is the
# slowest of them, not their sum.
jobs:
  # `pnpm run checks` builds both packages once (its `typecheck` step); lint
  # and `check:exports` (its `test` step) then read that build. The docs
  # tsconfig maps the interface onto its sources, so the docs check, which
  # runs before the build, needs no `dist`.
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v1
    with:
      docs-files: |
        README.md
        packages/dms-saas/README.md
        packages/dms-saas/docs
        packages/interface-dms-saas/README.md
        packages/interface-dms-saas/docs
      docs-typescript-project: packages/interface-dms-saas/docs/tsconfig.json
      renovate-sync: false
    permissions:
      contents: read

  # The Vitest suite is not part of `checks`: in its own job it runs alongside
  # the build and lint instead of after them, and keeps the mongod cache that
  # the reusable workflow has no input for.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # The Mongo-backed tests pin mongod 8.0.8, a 208 MB download every run
      # without this. mongodb-memory-server stores it in this home directory
      # by default.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-8.0.8-${{ runner.os }}

      # vitest aliases both packages to their sources: no build needed.
      - run: pnpm --filter @antelopejs/dms-saas test:unit

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Compile the published DMS source together with this frontend module.
      - run: pnpm --filter @antelopejs/dms-saas test:frontend

  # The single check to require on `main`: it keeps the historical job name,
  # and fails unless every job above succeeded.
  ubuntu:
    if: always()
    needs: [ci, unit, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: for result in $RESULTS; do [ "$result" = success ] || exit 1; done
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v1
